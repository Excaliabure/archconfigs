font-family		"JetBrains Mono"
tab_bar_style powerline
tab_bar_min_tabs 1
tab_bar_edge top
tab_bar_margin_width 0
tab_powerline_style slanted
tab_title_max_length 30

background_opacity 0.5


# Active tab color (the tab you are currently on)
active_tab_foreground   #000000
active_tab_background   #00ff00

# Inactive tab colors (background tabs)
inactive_tab_foreground #00ff00
inactive_tab_background #112211

# The empty space background next to the tabs
tab_bar_background      #001100



# Custom hotkeys to switch tabs instantly (Alt + Left/Right)
map alt+left  previous_tab
map alt+right next_tab


# Shortcut to open a new tab with Alt + T
map alt+t     new_tab
map alt+shift+t close_tab

